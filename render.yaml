services:
  - type: web
    name: workflow-jobs
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/workflow_jobs.db
    disk:
      name: workflow-data
      mountPath: /var/data
      sizeGB: 1
