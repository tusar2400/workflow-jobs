{% extends "base.html" %}{% block content %}<section class="section"><div class="sectionhead"><div><h1>Find Jobs</h1><p>Choose a task that fits you.</p></div><form class="search"><input name="q" value="{{q}}" placeholder="Search jobs..."><button>🔎</button></form></div><div class="jobgrid">{% for j in jobs %}<article class="job"><div class="reward">${{"%.2f"|format(j.reward)}} <span>{{j.category}} · {{j.minutes}} min</span></div><h3>{{j.title}}</h3><p>{{j.description}}</p><a class="btn small" href="{{url_for('job',job_id=j.id)}}">View Job</a></article>{% else %}<div class="empty">No jobs found.</div>{% endfor %}</div></section>{% endblock %}
